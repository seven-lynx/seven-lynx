name: Git Bonsai
on:
  schedule:
    - cron: "17 3 * * *"   # nightly, after the UTC day closes
  workflow_dispatch:
  push:
    paths: [.github/workflows/bonsai.yml]   # plants the tree right after you add this file
permissions:
  contents: write
concurrency: bonsai
jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Grows a deterministic pixel-art bonsai from the account's history and commits
      # bonsai.svg / bonsai.png / bonsai.gif (wind loop) / bonsai-growth.gif (seed -> today).
      # Style, species and pot size are earned from the history; only the palette is chosen.
      - uses: egorthinks/git-bonsai@v1
        with:
          season: auto             # spring | summer | autumn | winter | auto (follow the calendar)
          commit-message: "chore(bonsai): tend the tree"
