name: Git Bonsai
on:
  schedule:
    - cron: "17 3 * * *"   # nightly, after the UTC day closes
  workflow_dispatch:
  push:
    paths: [.github/workflows/bonsai.yml]   # plants the tree right after you add this file
permissions:
  contents: write
concurrency: bonsai
jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appnice/git-bonsai@v0
